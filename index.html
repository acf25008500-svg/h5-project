<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="将 HTML 项目发布到 GitHub Pages 并获取分享链接。">
  <title>HTML 发布器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">GITHUB PAGES PUBLISHER</p>
      <h1>把 HTML 变成可分享链接</h1>
      <p class="intro">选择完整项目文件夹，保留图片、CSS 和 JavaScript 的相对路径。发布完成后，可将 HTTPS 链接直接发到微信中打开。</p>
    </header>

    <section class="panel" aria-labelledby="credentials-title">
      <div class="section-heading">
        <span>01</span>
        <h2 id="credentials-title">连接 GitHub</h2>
      </div>
      <div class="grid credentials">
        <label>GitHub 用户名<input id="owner" autocomplete="username" placeholder="例如 octocat" required></label>
        <label>仓库名<input id="repo" value="h5-project" spellcheck="false" required></label>
        <label class="wide">个人访问令牌<input id="token" type="password" autocomplete="off" placeholder="仅本次使用，不会保存"></label>
      </div>
      <p class="hint">首次使用可点“创建仓库”。令牌需要能创建公开仓库、写入仓库内容；发布完成后可立即在 GitHub 撤销。</p>
      <button class="secondary" id="create-repo" type="button">创建公开仓库</button>
    </section>

    <section class="panel" aria-labelledby="files-title">
      <div class="section-heading">
        <span>02</span>
        <h2 id="files-title">选择 HTML 项目</h2>
      </div>
      <label class="dropzone" for="folder">
        <input id="folder" type="file" webkitdirectory directory multiple>
        <strong>选择项目文件夹</strong>
        <small>文件夹中必须包含至少一个 .html 文件</small>
      </label>
      <div class="selection" id="selection" aria-live="polite">尚未选择文件夹</div>
      <div class="actions">
        <button class="primary" id="publish" type="button">发布并获取链接</button>
      </div>
    </section>

    <section class="status" id="status" aria-live="polite" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
